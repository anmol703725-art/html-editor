<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Browser - Code Editor</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Write, edit, and run HTML, CSS, and JavaScript code online.</h1>
        <p>Our HTML editor updates the web view automatically in real time as you type.</p>
        <button id="theme-toggle" type="button">Dark Mode</button>
      </header>

      <section class="editor-preview" aria-label="Editor status">
        <div class="card">
          <h2>Live Status</h2>
          <p id="status-text">Your editor is set up and ready to code!</p>
          <button id="action-btn" type="button">Click Me</button>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
